  <script>
    // Ad bridge page: one screen, one button. ?s= picks the screenshot that
    // matches the ad; the App Store campaign token mirrors the homepage
    // (utm_source-utm_content) so App Analytics can split downloads per ad.
    (function () {
      var params = new URLSearchParams(location.search);
      var shots = {
        home: "/app-1-home-next-workout.jpg",
        engine: "/app-5-engine-progress.jpg",
        workouts: "/app-7-workouts-history.jpg"
      };
      var s = params.get("s");
      if (shots[s]) document.getElementById("shot").src = shots[s];

      var source = params.get("utm_source") || (params.has("fbclid") ? "meta" : "website");
      var content = params.get("utm_content");
      var token = (content ? source + "-" + content : source)
        .toLowerCase().replace(/[^a-z0-9_-]/g, "-").slice(0, 30) || "website";
      var cta = document.getElementById("cta");
      cta.href = "https://apps.apple.com/us/app/carmona-os/id6759835736?pt=128604529&ct=" + token + "&mt=8";
      cta.addEventListener("click", function () {
        // Same event and name as the homepage so the Lead-optimized ad sets compare like for like.
        if (window.fbq) window.fbq("track", "Lead", { content_name: "app_store_click", content_category: "bridge" });
      });
    })();
  </script>
